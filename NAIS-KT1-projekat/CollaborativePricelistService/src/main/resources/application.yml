server:
  port: 8090

spring:
  application:
    name: collaborative-pricelist-service
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      repositories:
        enabled: true
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: salescrm123
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# Default cache TTL (used by service when setting entries) in seconds
app:
  cache:
    default-ttl-seconds: 300

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
