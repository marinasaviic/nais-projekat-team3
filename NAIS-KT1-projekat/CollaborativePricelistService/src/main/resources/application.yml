server:
  port: 8090

spring:
  application:
    name: collaborative-pricelist-service
  redis:
    host: redis
    port: 6379
    timeout: 2000ms
  data:
    redis:
      repositories:
        enabled: true
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: salescrm123

# Default cache TTL (used by service when setting entries) in seconds
app:
  cache:
    default-ttl-seconds: 300

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true