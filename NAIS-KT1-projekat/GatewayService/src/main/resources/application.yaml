server:
  port: 9000

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: sales-process-tracking-service
          uri: lb://sales-process-tracking-service
          predicates:
            - Path=/sales/**
          filters:
            - StripPrefix=1

        - id: product-portfolio-service
          uri: lb://product-portfolio-service
          predicates:
            - Path=/portfolio/**
          filters:
            - StripPrefix=1

        - id: collaborative-pricelist-service
          uri: lb://collaborative-pricelist-service
          predicates:
            - Path=/pricelist/**
          filters:
            - StripPrefix=1

        - id: timeseries-service
          uri: lb://timeseries-service
          predicates:
            - Path=/timeseries/**
          filters:
            - StripPrefix=1

        - id: adverse-effects-search-service
          uri: lb://adverse-effects-search-service
          predicates:
            - Path=/adverse-effects-search-service/**
          filters:
            - StripPrefix=1

        - id: sales-analytics-service
          uri: http://sales-analytics-service:8080
          predicates:
            - Path=/analytics/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
