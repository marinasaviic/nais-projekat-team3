version: "3.3"

services:
  eureka-server:
    build:
      context: ./EurekaService
      dockerfile: Dockerfile
    image: eureka-server:latest
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  gateway-api:
    build:
      context: ./GatewayService
      dockerfile: Dockerfile
    image: gateway-api:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      sales-analytics-service:
        condition: service_started
      search-analytics-service:
        condition: service_started
    ports:
      - "9003:9000"

  sales-process-tracking-service:
    build:
      context: ./SalesProcessTrackingService
      dockerfile: Dockerfile
    image: sales-process-tracking-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      sales-neo4j:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_NEO4J_URI: bolt://sales-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: salescrm123
    ports:
      - "9060:8080"
    restart: on-failure

  collaborative-pricelist-service:
    build:
      context: ./CollaborativePricelistService
      dockerfile: Dockerfile
    image: collaborative-pricelist-service:latest
    depends_on:
      collaborative-pricelist-neo4j:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_NEO4J_URI: bolt://collaborative-pricelist-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: collaborative123
    ports:
      - "9061:8090"
    restart: on-failure

  product-portfolio-service:
    build:
      context: ./ProductPortfolioService
      dockerfile: Dockerfile
    image: product-portfolio-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      portfolio-neo4j:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_NEO4J_URI: bolt://portfolio-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: portfolio123
    ports:
      - "9070:8080"
    restart: on-failure

  adverse-effects-search-service:
    build:
      context: ./AdverseEffectsSearchService
      dockerfile: Dockerfile
    image: adverse-effects-search-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9062:8080"
    restart: on-failure

  sales-neo4j:
    image: neo4j:5
    container_name: sales-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/salescrm123
    volumes:
      - sales_neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "salescrm123", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  collaborative-pricelist-neo4j:
    image: neo4j:5
    container_name: collaborative-pricelist-neo4j
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      NEO4J_AUTH: neo4j/collaborative123
    volumes:
      - collaborative_pricelist_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "collaborative123", "RETURN 1"]
      interval: 20s
      timeout: 20s
      retries: 5

  portfolio-neo4j:
    image: neo4j:5
    container_name: portfolio-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/portfolio123
    volumes:
      - portfolio_neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "portfolio123", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: nais-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_adverse_effects_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: portfolio-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  redis:
    image: redis:7-alpine
    container_name: nais-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_adverse_effects_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: nais-redisinsight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

  timeseries-service:
    build:
      context: ./TimeseriesDatabaseService
      dockerfile: Dockerfile
    image: timeseries-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_INFLUX_URL: http://influxdb:8086
      SPRING_INFLUX_TOKEN: my-super-secret-auth-token
      SPRING_INFLUX_ORG: nais_org
      SPRING_INFLUX_BUCKET: nais_bucket
    ports:
      - "9080:8080"

  search-analytics-service:
    build:
      context: ./SearchAnalyticsService
      dockerfile: Dockerfile
    image: search-analytics-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "9091:8080"
    restart: on-failure

  sales-analytics-service:
    build:
      context: ./SalesAnalyticsService
      dockerfile: Dockerfile
    image: sales-analytics-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_INFLUX_URL: http://influxdb:8086
      SPRING_INFLUX_TOKEN: my-super-secret-auth-token
      SPRING_INFLUX_ORG: nais_org
      SPRING_INFLUX_BUCKET: nais_bucket
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/sales-analytics/analytics/stage-bottlenecks"]
      interval: 15s
      timeout: 10s
      retries: 10

  influxdb:
    image: influxdb:2.7.6
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: nais
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: nais_org
      DOCKER_INFLUXDB_INIT_BUCKET: nais_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: nais-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    depends_on:
      - product-portfolio-service
      - search-analytics-service

volumes:
  sales_neo4j_data: {}
  portfolio_neo4j_data: {}
  collaborative_pricelist_data: {}
  influxdb_data: {}
  elasticsearch_adverse_effects_data: {}
  redis_adverse_effects_data: {}
  redisinsight_data: {}