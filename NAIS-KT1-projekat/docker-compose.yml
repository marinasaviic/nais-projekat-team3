services:
  # Service Discovery: Keeps track of all microservices
  eureka-server:
    build: # Instructions for building a custom image from a local directory
      context: ./EurekaService # The directory containing the build files
      dockerfile: Dockerfile  # The specific file used to build the image
    image: eureka-server:latest # The name and tag given to the resulting image
    ports: # Maps host machine ports to container ports (HOST:CONTAINER)
      - "8761:8761"
    healthcheck: # A test to check if the container is running correctly
      # test: The actual command executed to verify the container's health
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s # How often to run the check
      timeout: 10s # How long to wait for a response
      retries: 5 # Number of failures before marking as unhealthy

  gateway-api:
    build:
      context: ./GatewayService
      dockerfile: Dockerfile
    image: gateway-api:latest
    environment: # Sets environment variables inside the container
      # Key-Value pairs used to configure the application environment at runtime
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on: # Ensures this service starts only after the listed services are running
      - eureka-server
    ports:
      - "9003:9000"


  sales-process-tracking-service:
    build:
      context: ./SalesProcessTrackingService
      dockerfile: Dockerfile
    image: sales-process-tracking-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      sales-neo4j:
        condition: service_healthy
    environment:      
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_NEO4J_URI: bolt://sales-neo4j:7687      
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: salescrm123
    ports:
      - "9060:8080"
    restart: on-failure

  collaborative-pricelist-service:
    build:
      context: ./CollaborativePricelistService
      dockerfile: Dockerfile
    image: collaborative-pricelist-service:latest
    depends_on:
      collaborative-pricelist-neo4j:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_NEO4J_URI: bolt://collaborative-pricelist-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: collaborative123
    ports:
      - "9061:8080"
    restart: on-failure

  product-portfolio-service:
    build:
      context: ./ProductPortfolioService
      dockerfile: Dockerfile
    image: product-portfolio-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      portfolio-neo4j:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_NEO4J_URI: bolt://portfolio-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: portfolio123
    ports:
      - "9070:8080"
    restart: on-failure

  sales-neo4j:
    image: neo4j:5
    container_name: sales-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/salescrm123
    volumes:
      - sales_neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "salescrm123", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5 

  collaborative-pricelist-neo4j:
    image: neo4j:5
    container_name: collaborative-pricelist-neo4j
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      NEO4J_AUTH: neo4j/collaborative123
    volumes:
      - collaborative_pricelist_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "collaborative123", "RETURN 1"]
      interval: 20s
      timeout: 20s
      retries: 5     

  portfolio-neo4j:
    image: neo4j:5
    container_name: portfolio-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/portfolio123
    volumes:
      - portfolio_neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "portfolio123", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  timeseries-service:
    build:
      context: ./TimeseriesDatabaseService
      dockerfile: Dockerfile
    image: timeseries-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_INFLUX_URL: http://influxdb:8086
      SPRING_INFLUX_TOKEN: my-super-secret-auth-token
      SPRING_INFLUX_ORG: nais_org
      SPRING_INFLUX_BUCKET: nais_bucket
    ports:
      - "9080:8080"

  sales-analytics-service:
    build:
      context: ./SalesAnalyticsService
      dockerfile: Dockerfile
    image: sales-analytics-service:latest
    depends_on:
      eureka-server:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_INFLUX_URL: http://influxdb:8086
      SPRING_INFLUX_TOKEN: my-super-secret-auth-token
      SPRING_INFLUX_ORG: nais_org
      SPRING_INFLUX_BUCKET: nais_bucket
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "9090:8080"

  influxdb:
    image: influxdb:2.7.6
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: nais
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: nais_org
      DOCKER_INFLUXDB_INIT_BUCKET: nais_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"


volumes: # Declares named volumes for persistent data storage across container restarts
  sales_neo4j_data: {}
  portfolio_neo4j_data: {}
  collaborative_pricelist_data: {}
  influxdb_data: {}
